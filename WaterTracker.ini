[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
ContextTitle=Target +1 gelas
ContextAction=[!CommandMeasure MeasureLua "ChangeTarget(1)"]
ContextTitle2=Target -1 gelas
ContextAction2=[!CommandMeasure MeasureLua "ChangeTarget(-1)"]
ContextTitle3=Reset hitungan hari ini
ContextAction3=[!CommandMeasure MeasureLua "ResetToday()"]
ContextTitle4=Buka/tutup kalender
ContextAction4=[!CommandMeasure MeasureLua "ToggleCal()"]
ContextTitle5=Pengaturan pengingat...
ContextAction5=[!CommandMeasure MeasureLua "OpenSettings()"]
ContextTitle6=---
ContextTitle7=Tema: Gelap
ContextAction7=[!WriteKeyValue Variables Theme Dark "#@#Variables.inc"][!Refresh]
ContextTitle8=Tema: Terang
ContextAction8=[!WriteKeyValue Variables Theme Light "#@#Variables.inc"][!Refresh]
ContextTitle9=Aksen: Merah OnePlus
ContextAction9=[!WriteKeyValue Variables Accent "235,0,41,255" "#@#Variables.inc"][!Refresh]
ContextTitle10=Aksen: Biru
ContextAction10=[!WriteKeyValue Variables Accent "56,118,244,255" "#@#Variables.inc"][!Refresh]

[Metadata]
Name=Water Tracker
Author=Claude
Information=Penghitung gelas air harian bergaya OxygenOS, dengan kalender riwayat minum. Riwayat disimpan di @Resources\History.txt.
Version=3.0
License=CC BY-NC-SA 4.0

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Themes\#Theme#.inc
; Ukuran satu gelas (ml)
GlassSize=250
; Kalau punya OnePlus Sans, taruh file .ttf-nya di @Resources\Fonts lalu ganti nilai ini
Font=Segoe UI
ColorDone=46,196,110,255
ColorOnAccent=255,255,255,255
RingColor=#Accent#
MinusFill=#ColorButton2#
PlusStroke=#Accent#
CalFill=#ColorButton2#
CalIcon=#ColorText#
; Nilai di bawah diisi oleh Water.lua
Count=0
LastTime=-
Previous=0
InfoLeft=Terakhir -
BellFill=#ColorButton2#
BellIcon=#ColorText#
Alert=0
AlertText=Waktunya minum!
ToastTitle=Waktunya minum air
ToastMsg=

; ================= MEASURES =================

[MeasureLua]
Measure=Script
ScriptFile=#@#Water.lua

; Notifikasi Windows lewat Toast.ps1 (dijalankan tersembunyi)
[MeasureToast]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#Toast.ps1" -Title "#ToastTitle#" -Message "#ToastMsg#"
State=Hide
DynamicVariables=1

[MeasureDate]
Measure=Time
Format=%A, %#d %B
FormatLocale=id-ID

[MeasurePercent]
Measure=Calc
Group=Data
Formula=Round(#Count# / #Target# * 100)
DynamicVariables=1
IfCondition=(#Count# >= #Target#)
IfTrueAction=[!SetVariable RingColor "#ColorDone#"][!SetOption MeterSubtitle Text "Target tercapai"][!SetOption MeterSubtitle FontColor "#ColorDone#"]
IfFalseAction=[!SetVariable RingColor "#Accent#"][!SetOption MeterSubtitle Text "%1"][!SetOption MeterSubtitle FontColor "#ColorDim#"]

[MeasureRing]
Measure=Calc
Group=Data
Formula=Min(#Count# / #Target#, 1)
MinValue=0
MaxValue=1
DynamicVariables=1

[MeasureFull]
Measure=Calc
Formula=1
MinValue=0
MaxValue=1

[MeasureMl]
Measure=Calc
Group=Data
Formula=#Count# * #GlassSize#
DynamicVariables=1

[MeasureMlTarget]
Measure=Calc
Group=Data
Formula=#Target# * #GlassSize#
DynamicVariables=1

; Lebar satu segmen progres (total 260 px, jarak 4 px)
[MeasureSeg]
Measure=Calc
Group=Data
Formula=(260 - (#Target# - 1) * 4) / #Target#
DynamicVariables=1

; ================= STYLES =================

[StyleText]
FontFace=#Font#
FontColor=#ColorText#
AntiAlias=1
DynamicVariables=1

[StyleCal]
Hidden=(#CalOpen# = 0)
DynamicVariables=1

[StyleRing]
X=212
Y=62
W=68
H=68
StartAngle=(Rad(270))
RotationAngle=(Rad(360))
LineStart=27.5
LineLength=34
Solid=1
AntiAlias=1
DynamicVariables=1

; ================= METERS =================

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,300,(#CalOpen# = 1 ? 672 : 256),28 | Fill Color #ColorCard# | StrokeWidth 1 | Stroke Color #ColorStroke#
DynamicVariables=1

; --- Header ---
[MeterIcon]
Meter=Shape
X=20
Y=20
Shape=Ellipse 15,15,15 | Fill Color #Accent# | StrokeWidth 0
Shape2=Path Drop | Fill Color #ColorOnAccent# | StrokeWidth 0
Drop=15,7 | LineTo 10.4,15.5 | ArcTo 19.6,15.5,5.4,5.4,0,1,0 | ClosePath 1

[MeterTitle]
Meter=String
MeterStyle=StyleText
X=60
Y=19
FontSize=11
FontWeight=600
Text=Minum Air

[MeterSubtitle]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureDate
X=60
Y=37
FontSize=8
FontColor=#ColorDim#
Text=%1

[MeterBell]
Meter=Shape
X=250
Y=20
Shape=Ellipse 15,15,15 | Fill Color #BellFill# | StrokeWidth 0
Shape2=Path Bell | Fill Color #BellIcon# | StrokeWidth 0
; Lonceng dipusatkan di lingkaran (y 7..23, sama seperti tetes air di ikon kiri)
Bell=9.5,17.5 | LineTo 9.5,12.5 | ArcTo 20.5,12.5,5.5,5.5,0,0,1 | LineTo 20.5,17.5 | LineTo 22,19 | LineTo 8,19 | ClosePath 1
Shape3=Ellipse 15,21.3,1.9 | Fill Color #BellIcon# | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureLua "OpenSettings()"]
ToolTipText=Pengaturan pengingat minum

; --- Angka utama ---
[MeterCount]
Meter=String
MeterStyle=StyleText
X=18
Y=62
FontSize=34
FontWeight=700
Text=#Count#

[MeterOf]
Meter=String
MeterStyle=StyleText
X=3R
Y=31r
FontSize=11
FontWeight=500
FontColor=#ColorDim#
Text=/ #Target# gelas
ToolTipText=Scroll untuk mengubah target (1-12)
MouseScrollUpAction=[!CommandMeasure MeasureLua "ChangeTarget(1)"]
MouseScrollDownAction=[!CommandMeasure MeasureLua "ChangeTarget(-1)"]

[MeterMl]
Meter=String
MeterStyle=StyleText
MeasureName=MeasureMl
MeasureName2=MeasureMlTarget
X=20
Y=116
FontSize=9
FontColor=#ColorDim#
Text=%1 dari %2 ml

; --- Cincin progres ---
[MeterRingTrack]
Meter=Roundline
MeterStyle=StyleRing
MeasureName=MeasureFull
LineColor=#ColorTrack#

[MeterRing]
Meter=Roundline
MeterStyle=StyleRing
MeasureName=MeasureRing
LineColor=#RingColor#

[MeterPercent]
Meter=String
MeterStyle=StyleText
MeasureName=MeasurePercent
X=246
Y=96
StringAlign=CenterCenter
FontSize=12
FontWeight=700
Text=%1%

