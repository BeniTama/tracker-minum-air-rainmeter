[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos 1]

[Metadata]
Name=Water Tracker - Pengaturan Pengingat
Information=Dialog pengaturan pengingat minum. Dibuka dari ikon lonceng di Water Tracker.
Version=1.0

[Variables]
@Include=#@#Variables.inc
@Include2=#@#Themes\#Theme#.inc
Font=Segoe UI
ColorOnAccent=255,255,255,255

[MeasureSettings]
Measure=Script
ScriptFile=#@#Settings.lua

[StyleText]
FontFace=#Font#
FontColor=#ColorText#
AntiAlias=1

[StyleRound]
Shape=Ellipse 11,11,11 | Fill Color #ColorButton2Hover# | StrokeWidth 0

[StyleMinus]
Shape2=Rectangle 6.5,10.2,9,1.6,0.8 | Fill Color #ColorText# | StrokeWidth 0

[StylePlus]
Shape2=Rectangle 6.5,10.2,9,1.6,0.8 | Fill Color #ColorText# | StrokeWidth 0
Shape3=Rectangle 10.2,6.5,1.6,9,0.8 | Fill Color #ColorText# | StrokeWidth 0

[MeterCard]
Meter=Shape
Shape=Rectangle 0,0,300,410,28 | Fill Color #ColorCard# | StrokeWidth 1 | Stroke Color #ColorStroke#

; --- Header ---
[MeterIcon]
Meter=Shape
X=20
Y=20
Shape=Ellipse 15,15,15 | Fill Color #Accent# | StrokeWidth 0
Shape2=Path Bell | Fill Color #ColorOnAccent# | StrokeWidth 0
Bell=10,19 | LineTo 10,14.5 | ArcTo 20,14.5,5,5,0,0,1 | LineTo 20,19 | LineTo 21.5,20.6 | LineTo 8.5,20.6 | ClosePath 1
Shape3=Ellipse 15,22.6,1.8 | Fill Color #ColorOnAccent# | StrokeWidth 0

[MeterTitle]
Meter=String
MeterStyle=StyleText
X=60
Y=19
FontSize=11
FontWeight=600
Text=Pengingat minum

[MeterSubtitle]
Meter=String
MeterStyle=StyleText
X=60
Y=37
FontSize=8
FontColor=#ColorDim#
Text=Ingatkan kalau lama belum minum

[MeterClose]
Meter=Shape
X=252
Y=18
Shape=Ellipse 14,14,14 | Fill Color #ColorButton2# | StrokeWidth 0
Shape2=Line 10,10,18,18 | StrokeWidth 1.6 | Stroke Color #ColorText# | StrokeStartCap Round | StrokeEndCap Round
Shape3=Line 18,10,10,18 | StrokeWidth 1.6 | Stroke Color #ColorText# | StrokeStartCap Round | StrokeEndCap Round
LeftMouseUpAction=[!DeactivateConfig]
ToolTipText=Tutup

